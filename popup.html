<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bihar RTPS AutoFill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ── HEADER ──────────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="rgba(255,255,255,0.15)"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <div>
        <h1>RTPS AutoFill</h1>
        <p class="subtitle">Bihar ServicePlus Fast Filler</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-capture-page" class="icon-btn" title="Capture from Current RTPS Form">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button id="btn-import" class="icon-btn" title="Import Profiles">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <button id="btn-export" class="icon-btn" title="Export Profiles">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── ACTIVE FORM STATUS ──────────────────────────── -->
  <div class="status-bar" id="status-bar">
    <span class="status-indicator" id="status-indicator"></span>
    <span id="status-text">Checking active RTPS tab...</span>
  </div>

  <!-- ── TAB NAVIGATION ──────────────────────────────── -->
  <nav class="tabs">
    <button class="tab active" data-tab="profiles">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      </svg>
      Saved Profiles
    </button>
    <button class="tab" data-tab="editor" id="tab-btn-editor">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      New / Edit Profile
    </button>
  </nav>

  <!-- ── PROFILES LIST ───────────────────────────────── -->
  <div class="tab-content active" id="tab-profiles">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-profiles" placeholder="Search by name, mobile, district...">
    </div>
    <div class="profiles-list" id="profiles-list"></div>
  </div>

  <!-- ── PROFILE EDITOR ──────────────────────────────── -->
  <div class="tab-content" id="tab-editor">
    <form id="profile-form" autocomplete="off">
      <input type="hidden" id="edit-id">

      <!-- 1. Mandatory Identity Fields -->
      <div class="form-section">
        <div class="section-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <h3>Applicant Details (आवश्यक विवरण)</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-gender">Gender / लिंग *</label>
            <select id="f-gender">
              <option value="Male">Male / पुरुष</option>
              <option value="Female">Female / स्त्री</option>
              <option value="Third Gender">Third Gender / तृतीय लिंग</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-salutation">Salutation / अभिवादन *</label>
            <select id="f-salutation">
              <option value="Shri">Shri / श्री</option>
              <option value="Smt">Smt / श्रीमती</option>
              <option value="Kumari">Kumari / कुमारी</option>
              <option value="None">कोई अभिवादन नहीं</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-name-en">Name (English) *</label>
            <input type="text" id="f-name-en" placeholder="Applicant Name">
          </div>
          <div class="form-group">
            <label for="f-name-hi">Name (Hindi) [Auto]</label>
            <input type="text" id="f-name-hi" placeholder="Auto Hindi">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-dob">Date of Birth (DD/MM/YYYY) *</label>
            <input type="text" id="f-dob" placeholder="01/01/2000">
          </div>
          <div class="form-group">
            <label for="f-mobile">Mobile Number *</label>
            <input type="tel" id="f-mobile" placeholder="10-digit number" maxlength="10">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label for="f-religion">Religion / धर्म *</label>
            <select id="f-religion">
              <option value="Hindu">Hindu / हिन्दू</option>
              <option value="Muslim">Muslim / मुस्लिम</option>
              <option value="Sikh">Sikh / सिख</option>
              <option value="Christian">Christian / ईसाई</option>
              <option value="Buddhism">Buddhism / बौद्ध</option>
              <option value="Jain">Jain / जैन</option>
              <option value="Other">Other / अन्य</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 2. Parents / Relations -->
      <div class="form-section">
        <div class="section-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
          <h3>Parents & Husband Details</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-father-en">Father's Name (English) *</label>
            <input type="text" id="f-father-en" placeholder="Father's Name">
          </div>
          <div class="form-group">
            <label for="f-father-hi">Father's Name (Hindi)</label>
            <input type="text" id="f-father-hi" placeholder="Auto Hindi">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-mother-en">Mother's Name (English) *</label>
            <input type="text" id="f-mother-en" placeholder="Mother's Name">
          </div>
          <div class="form-group">
            <label for="f-mother-hi">Mother's Name (Hindi)</label>
            <input type="text" id="f-mother-hi" placeholder="Auto Hindi">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-husband-en">Husband's Name (English)</label>
            <input type="text" id="f-husband-en" placeholder="If applicable">
          </div>
          <div class="form-group">
            <label for="f-husband-hi">Husband's Name (Hindi)</label>
            <input type="text" id="f-husband-hi" placeholder="If applicable">
          </div>
        </div>
      </div>

      <!-- 3. Address Details -->
      <div class="form-section">
        <div class="section-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <h3>Permanent Address (स्थाई पता)</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-state">State / राज्य *</label>
            <input type="text" id="f-state" value="BIHAR" placeholder="BIHAR">
          </div>
          <div class="form-group">
            <label for="f-district">District / जिला *</label>
            <select id="f-district">
              <option value="">Select District</option>
              <option value="Araria">Araria</option>
              <option value="Arwal">Arwal</option>
              <option value="Aurangabad">Aurangabad</option>
              <option value="Banka">Banka</option>
              <option value="Begusarai">Begusarai</option>
              <option value="Bhagalpur">Bhagalpur</option>
              <option value="Bhojpur">Bhojpur</option>
              <option value="Buxar">Buxar</option>
              <option value="Darbhanga">Darbhanga</option>
              <option value="East Champaran">East Champaran</option>
              <option value="Gaya">Gaya</option>
              <option value="Gopalganj">Gopalganj</option>
              <option value="Jamui">Jamui</option>
              <option value="Jehanabad">Jehanabad</option>
              <option value="Kaimur">Kaimur</option>
              <option value="Katihar">Katihar</option>
              <option value="Khagaria">Khagaria</option>
              <option value="Kishanganj">Kishanganj</option>
              <option value="Lakhisarai">Lakhisarai</option>
              <option value="Madhepura">Madhepura</option>
              <option value="Madhubani">Madhubani</option>
              <option value="Munger">Munger</option>
              <option value="Muzaffarpur">Muzaffarpur</option>
              <option value="Nalanda">Nalanda</option>
              <option value="Nawada">Nawada</option>
              <option value="Patna">Patna</option>
              <option value="Purnia">Purnia</option>
              <option value="Rohtas">Rohtas</option>
              <option value="Saharsa">Saharsa</option>
              <option value="Samastipur">Samastipur</option>
              <option value="Saran">Saran</option>
              <option value="Sheikhpura">Sheikhpura</option>
              <option value="Sheohar">Sheohar</option>
              <option value="Sitamarhi">Sitamarhi</option>
              <option value="Siwan">Siwan</option>
              <option value="Supaul">Supaul</option>
              <option value="Vaishali">Vaishali</option>
              <option value="West Champaran">West Champaran</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-subdivision">Sub-Division / अनुमंडल *</label>
            <input type="text" id="f-subdivision" placeholder="Sub-Division name">
          </div>
          <div class="form-group">
            <label for="f-block">Block / प्रखंड *</label>
            <input type="text" id="f-block" placeholder="Block name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-village">Village / मोहल्ला *</label>
            <input type="text" id="f-village" placeholder="Village / Town">
          </div>
          <div class="form-group">
            <label for="f-po">Post Office / डाकघर *</label>
            <input type="text" id="f-po" placeholder="Post Office">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-ps">Police Station / थाना *</label>
            <input type="text" id="f-ps" placeholder="Police Station">
          </div>
          <div class="form-group">
            <label for="f-pin">Pin Code *</label>
            <input type="text" id="f-pin" placeholder="6-digit PIN" maxlength="6">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-localbody">Local Body Type / स्थानीय निकाय</label>
            <select id="f-localbody">
              <option value="Village Panchayat">Gram Panchayat / ग्राम पंचायत</option>
              <option value="Municipal Corporation">Municipal Corporation / नगर निगम</option>
              <option value="Municipality">Municipality / नगर परिषद</option>
              <option value="Town Panchayat">Town Panchayat / नगर पंचायत</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-panchayat">Gram Panchayat / ग्राम पंचायत</label>
            <input type="text" id="f-panchayat" placeholder="Gram Panchayat Name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-ward">Ward Number / वार्ड संख्या</label>
            <input type="text" id="f-ward" placeholder="Ward number">
          </div>
        </div>
      </div>

      <!-- 4. Category, Caste, Profession & Income -->
      <div class="form-section">
        <div class="section-header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
          <h3>Caste, Profession & Income Details</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-category">Category / वर्ग *</label>
            <select id="f-category">
              <option value="BC">BC / पिछड़ा वर्ग (अनुसूची-2)</option>
              <option value="EBC">EBC / अत्यंत पिछड़ा वर्ग (अनुसूची-1)</option>
              <option value="SC">SC / अनुसूचित जाति</option>
              <option value="ST">ST / अनुसूचित जनजाति</option>
              <option value="General">General / गैर आरक्षित (EWS)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-caste">Caste / जाति Name *</label>
            <input type="text" id="f-caste" placeholder="e.g. Yadav, Kurmi, Brahmin, Rajput">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-subcaste">Sub-Caste / उपजाति</label>
            <input type="text" id="f-subcaste" placeholder="If any">
          </div>
          <div class="form-group">
            <label for="f-serial">Caste Serial No. / जाति क्रमांक</label>
            <input type="text" id="f-serial" placeholder="Serial number">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-profession">Profession / पेशा *</label>
            <select id="f-profession">
              <option value="Student">Student / छात्र</option>
              <option value="Govt. Service">Govt. Service / सरकारी सेवा</option>
              <option value="Private Service">Private Service / निजी सेवा</option>
              <option value="Business">Business / व्यापार</option>
              <option value="Farmer">Farmer / किसान</option>
              <option value="Housewife">Housewife / गृहिणी</option>
              <option value="Other">Other / अन्य</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-annual-income">Annual Family Income / वार्षिक आय (₹) *</label>
            <input type="number" id="f-annual-income" placeholder="e.g. 90000" min="0">
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="btn-capture-active" class="btn btn-capture" title="Capture from active RTPS form page">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Capture
        </button>
        <button type="submit" id="btn-save" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
          </svg>
          Save Profile
        </button>
      </div>
    </form>
  </div>

  <input type="file" id="import-file" accept=".json" style="display:none">
  <div class="toast-container" id="toast-container"></div>
  <script src="popup.js"></script>
</body>
</html>
